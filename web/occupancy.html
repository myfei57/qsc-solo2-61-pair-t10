<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舱室在场人数</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1f24; }
nav a { margin-right: 1rem; color: #0b5fff; text-decoration: none; }
table { border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.75rem; text-align: left; }
th { background: #f6f8fa; }
.bar { background: #eaeef2; border-radius: 4px; width: 160px; height: 14px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: #2da44e; }
.bar.over > span { background: #cf222e; }
.bar.full > span { background: #bf8700; }
.tag { font-size: 0.8rem; padding: 0 0.4rem; border-radius: 3px; }
.tag.over { background: #ffebe9; color: #cf222e; }
.tag.full { background: #fff8c5; color: #9a6700; }
section { margin-top: 2rem; }
input, select, button { font: inherit; padding: 0.25rem 0.5rem; margin-right: 0.4rem; }
button { cursor: pointer; }
.muted { color: #57606a; font-size: 0.85rem; }
#result { white-space: pre-wrap; background: #f6f8fa; padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem; }
</style>
</head>
<body>
<nav><a href="/cabins">Cabins</a><a href="/occupancy">Occupancy</a><a href="/env">Environment</a><a href="/patrols">Patrols</a><a href="/alarms">Alarms</a></nav>
<h1>舱室在场人数与超员准入</h1>
<p>人数、放行审批和告警引用同一份只追加刷卡流水（按事件时间归并）。控制台数字与审计流水可逐项核对。</p>

<section>
<h2>各舱室实时人数</h2>
<table>
<thead><tr><th>舱室</th><th>在场 / 上限</th><th>占比</th><th>预留</th><th>在场人员</th><th>状态</th><th>流水版本</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="muted">总在场人数 <b id="total">–</b> ｜ 未确认告警 <b id="alarms">–</b></p>
</section>

<section>
<h2>放行操作（在线刷码）</h2>
<form id="swipe-form">
  <input name="cabin_id" placeholder="舱室 cabin-1" required>
  <input name="person_id" placeholder="人员 ID" required>
  <select name="direction"><option value="in">刷进 IN</option><option value="out">刷出 OUT</option></select>
  <input name="at" placeholder="事件时间(留空=现在)">
  <input name="event_id" placeholder="事件ID(设备幂等键)">
  <button type="submit">提交刷码</button>
</form>
<div id="result" class="muted">结果将显示在这里。</div>
</section>

<section>
<h2>设备离线补传 / 审批占位 / 滞留巡检</h2>
<form id="backfill-form">
  <input name="cabin_id" placeholder="舱室" required>
  <input name="person_id" placeholder="人员 ID" required>
  <select name="direction"><option value="in">IN</option><option value="out">OUT</option></select>
  <input name="at" placeholder="事件时间" required>
  <input name="event_id" placeholder="事件ID(幂等键)" required>
  <button type="submit">补传单条</button>
</form>
<form id="approve-form" style="margin-top:0.5rem">
  <input name="cabin_id" placeholder="舱室" required>
  <input name="person_id" placeholder="被批准人" required>
  <input name="ttl_seconds" type="number" value="600" style="width:8rem">
  <button type="submit">审批并预留名额</button>
</form>
<form id="sweep-form" style="margin-top:0.5rem">
  <button type="submit">巡检：释放过期预留 + 查滞留</button>
</form>
</section>

<section>
<h2>告警</h2>
<table>
<thead><tr><th>类型</th><th>舱室</th><th>人员</th><th>发生时间</th><th>人数/上限</th><th>说明</th><th>状态</th></tr></thead>
<tbody id="alarm-rows"></tbody>
</table>
</section>

<script>
function post(path, payload) {
  return fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)})
    .then((r) => r.json());
}
function show(payload) { document.getElementById("result").textContent = JSON.stringify(payload, null, 2); }

async function load() {
  const data = await (await fetch("/api/occupancy")).json();
  document.getElementById("total").textContent = data.total_occupied;
  document.getElementById("alarms").textContent = data.active_alarms;
  document.getElementById("rows").innerHTML = data.cabins.map((c) => {
    const pct = c.capacity ? Math.min(100, Math.round(100 * c.occupied / c.capacity)) : 0;
    const cls = c.over ? "over" : (c.at_capacity ? "full" : "");
    const tag = c.over ? '<span class="tag over">超员</span>' : (c.at_capacity ? '<span class="tag full">满员</span>' : '<span class="muted">正常</span>');
    return `<tr><td>${c.cabin_id}</td><td>${c.occupied} / ${c.capacity}</td>` +
      `<td><div class="bar ${cls}"><span style="width:${pct}%"></span></div></td>` +
      `<td>${c.reserved}</td><td>${c.present.join(", ") || "—"}${c.anonymous ? ` (+${c.anonymous}未登记)` : ""}</td>` +
      `<td>${tag}</td><td>${c.version}</td></tr>`;
  }).join("");
  document.getElementById("alarm-rows").innerHTML = data.alarms.map((a) =>
    `<tr><td>${a.kind}</td><td>${a.cabin_id}</td><td>${a.person_id}</td><td>${a.at}</td>` +
    `<td>${a.occupied}/${a.capacity}</td><td>${a.message}</td><td>${a.active ? "未确认" : "已确认"}</td></tr>`).join("");
}

document.getElementById("swipe-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const payload = {cabin_id: f.cabin_id.value, person_id: f.person_id.value, direction: f.direction.value};
  if (f.at.value) payload.at = f.at.value;
  if (f.event_id.value) payload.event_id = f.event_id.value;
  show(await post("/api/occupancy/swipe", payload));
  load();
});
document.getElementById("backfill-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  show(await post("/api/occupancy/backfill", {
    cabin_id: f.cabin_id.value, person_id: f.person_id.value,
    direction: f.direction.value, at: f.at.value, event_id: f.event_id.value,
  }));
  load();
});
document.getElementById("approve-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  show(await post("/api/occupancy/approve", {
    cabin_id: f.cabin_id.value, person_id: f.person_id.value, ttl_seconds: Number(f.ttl_seconds.value),
  }));
  load();
});
document.getElementById("sweep-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  show(await post("/api/occupancy/sweep", {}));
  load();
});
load();
setInterval(load, 5000);
</script>
</body>
</html>
